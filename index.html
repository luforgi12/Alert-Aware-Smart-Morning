<!doctype html>
<html lang="ua">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Morning Security Widget</title>
    <script>
      // Застосовуємо збережену тему до першого рендеру, щоб не було світлого спалаху.
      try {
        if (localStorage.getItem("app_theme") === "light") {
          document.documentElement.classList.add("light");
        }
      } catch (e) {
        /* ignore */
      }
    </script>
    <meta
      property="og:image"
      content="https://bolt.new/static/og_default.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://bolt.new/static/og_default.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
